<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur serveur — StockPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="d-flex flex-column align-items-center justify-content-center min-vh-100 text-center px-3">
    <div style="font-size:5rem;color:#dee2e6;line-height:1;">
        <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h1 class="fw-bold mt-3" style="font-size:4rem;color:#6c757d;">500</h1>
    <h2 class="h4 fw-semibold mb-2">Erreur interne du serveur</h2>
    <p class="text-muted mb-4" style="max-width:420px;">
        Une erreur inattendue s'est produite. Notre équipe a été notifiée.<br>
        Veuillez réessayer dans quelques instants.
    </p>
    <div class="d-flex gap-2">
        <a href="/" class="btn btn-primary">
            <i class="bi bi-house me-1"></i>Accueil
        </a>
        <button onclick="location.reload()" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-clockwise me-1"></i>Réessayer
        </button>
    </div>
    <p class="text-muted mt-5 small">&copy; 2026 StockPro Automobile — Tous droits réservés</p>
</div>
</body>
</html>
